services:
  db:
    image: postgres:17
    # 학습용 값이다
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order_api
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: localaccess
      RUSTFS_SECRET_KEY: localsecret123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data

volumes:
  pgdata:
  storagedata:

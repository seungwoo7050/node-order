name: node-order

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# 메모리 상한(31 후속). 서버는 t3.small(2GB). 전환 순간에는 api·web가 두 벌씩 함께 뜬다:
#   OS·도커 256 + caddy 64 + redis 128 + prometheus 256 + alertmanager 64 = 768MB
#   남은 1280MB / 두 벌 = 640MB → api 448MB(관찰 약 380MiB) + web 192MB
# V8 힙 상한(--max-old-space-size)을 컨테이너 상한보다 낮게 두어, 힙이 차면 OOM kill 전에 GC가 먼저 돈다.
# 합계는 monitoring/test.sh가 docker compose config로 다시 센다(check-memory-budget.mjs)
x-api: &api
  logging: *logging
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  mem_limit: 448m
  environment: &api-env
    NODE_OPTIONS: --max-old-space-size=320
    PORT: "4000"
    JWT_SECRET: ${JWT_SECRET:?}
    DEMO_LOGIN: ${DEMO_LOGIN:-0}
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
    RATE_LIMIT_ALLOW_IPS: ${RATE_LIMIT_ALLOW_IPS:-}
    AUTH_RATE_LIMIT_PER_MINUTE: "20"
    TRUST_PROXY: uniquelocal
    FRONTEND_URL: https://${WEB_HOST}
    ACCESS_TOKEN_TTL: 15m
    DATABASE_URL: ${DATABASE_URL:?}
    NODE_EXTRA_CA_CERTS: /certs/rds-ca.pem
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: ""
    S3_REGION: ${AWS_REGION:?}
    S3_BUCKET: ${S3_BUCKET:?}
    LOG_LEVEL: info
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
    TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    JUSO_API_KEY: ${JUSO_API_KEY:-}
    SMTP_URL: ${SMTP_URL:-}
    SMTP_HOST: ${SMTP_HOST:-}
    # 오류 추적(31): DSN이 있을 때만 켜진다. release는 서비스마다 그 슬롯의 이미지 태그(api-blue·api-green)
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    # 업무 지표(31)
    BUSINESS_METRICS_INTERVAL_MS: ${BUSINESS_METRICS_INTERVAL_MS:-30000}
    FULFILLMENT_OVERDUE_DAYS: ${FULFILLMENT_OVERDUE_DAYS:-3}
    LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-200000}
  volumes:
    - ./rds-ca.pem:/certs/rds-ca.pem:ro
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 5s
    retries: 6
    start_period: 20s

x-web: &web
  logging: *logging
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  mem_limit: 192m
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 5s
    retries: 6
    start_period: 10s

services:
  caddy:
    logging: *logging
    image: caddy:2
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_HOST: ${WEB_HOST:?WEB_HOST를 .env에 적는다}
      API_HOST: ${API_HOST:?API_HOST를 .env에 적는다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./live:/etc/caddy/live:ro
      - caddy_data:/data

  redis:
    logging: *logging
    image: redis:7
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  migrate:
    logging: *logging
    image: ${IMAGE_PREFIX:-ghcr.io/seungwoo7050/node-order}/order-api-migrate:${RELEASE_TAG:-none}
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      NODE_EXTRA_CA_CERTS: /certs/rds-ca.pem
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ""
      S3_REGION: ${AWS_REGION:?}
      S3_BUCKET: ${S3_BUCKET:?}
    volumes:
      - ./rds-ca.pem:/certs/rds-ca.pem:ro

  api-blue:
    <<: *api
    profiles: ["blue"]
    image: ${IMAGE_PREFIX:-ghcr.io/seungwoo7050/node-order}/order-api:${BLUE_TAG:-none}
    environment:
      <<: *api-env
      SENTRY_RELEASE: ${BLUE_TAG:-}
  api-green:
    <<: *api
    profiles: ["green"]
    image: ${IMAGE_PREFIX:-ghcr.io/seungwoo7050/node-order}/order-api:${GREEN_TAG:-none}
    environment:
      <<: *api-env
      SENTRY_RELEASE: ${GREEN_TAG:-}

  web-blue:
    <<: *web
    profiles: ["blue"]
    image: ${IMAGE_PREFIX:-ghcr.io/seungwoo7050/node-order}/order-web:${BLUE_TAG:-none}
    environment:
      API_URL: http://api-blue:4000
      AUTH_URL: https://${WEB_HOST}
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_GITHUB_ID: ${GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NODE_OPTIONS: --max-old-space-size=128
      SENTRY_DSN: ${SENTRY_WEB_DSN:-${SENTRY_DSN:-}}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${BLUE_TAG:-}
  web-green:
    <<: *web
    profiles: ["green"]
    image: ${IMAGE_PREFIX:-ghcr.io/seungwoo7050/node-order}/order-web:${GREEN_TAG:-none}
    environment:
      API_URL: http://api-green:4000
      AUTH_URL: https://${WEB_HOST}
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_GITHUB_ID: ${GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NODE_OPTIONS: --max-old-space-size=128
      SENTRY_DSN: ${SENTRY_WEB_DSN:-${SENTRY_DSN:-}}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${GREEN_TAG:-}

  # 모니터링(31). 운영에는 Prometheus·Alertmanager만 두고, Grafana는 개발 PC에서 SSH 터널로 붙인다(docs/runbook.md 공통).
  # 포트는 서버 안(127.0.0.1)에만 연다. 설정 파일은 저장소의 monitoring/(서버에서는 MONITORING_DIR=./monitoring)
  prometheus:
    logging: *logging
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${MONITORING_DIR:-../monitoring}/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_DIR:-../monitoring}/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./live:/etc/prometheus/live:ro # release.sh가 쓰는 targets.json(활성 API)
      - prometheus_data:/prometheus

  alertmanager:
    logging: *logging
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    mem_limit: 64m
    # 설정은 render.sh가 환경변수로 만든다. 주소가 비어 있으면 null 수신자(기동은 된다)
    entrypoint: ["/bin/sh", "/etc/alertmanager/render.sh", "--run"]
    command: ["--storage.path=/alertmanager", "--cluster.listen-address="]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DEADMAN_URL: ${DEADMAN_URL:-}
      RUNBOOK_BASE_URL: ${RUNBOOK_BASE_URL:-}
      ALERT_ENV: ${ALERT_ENV:-production}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ${MONITORING_DIR:-../monitoring}/alertmanager/render.sh:/etc/alertmanager/render.sh:ro
      - alertmanager_data:/alertmanager

volumes:
  caddy_data:
  prometheus_data:
  alertmanager_data:

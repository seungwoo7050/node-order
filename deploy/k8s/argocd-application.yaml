apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-order-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seungwoo7050/node-order.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: node-order
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

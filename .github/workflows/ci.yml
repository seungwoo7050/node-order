name: ci

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    name: 린트/타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: action/checkout@v4
      - uses: action/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: order-api-nest
      - run: npm run lint
      - run: npm run typecheck

name: ci

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/seungwoo7050/node-order

jobs:
  check:
    name: 린트/타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: order-api-nest
      - run: npm run lint
      - run: npm run typecheck

  test-api:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env: { POSTGRES_USER: order, POSTGRES_PASSWORD: order, POSTGRES_DB: order_api }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U order -d order_api" --health-interval 2s --health-retries 15
      redis:
        image: redis:7
        ports: ["6380:6379"]
      storage:
        image: rustfs/rustfs:latest
        env: { RUSTFS_ACCESS_KEY: localaccess, RUSTFS_SECRET_KEY: localsecret123 }
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 테스트 DB 준비
        working-directory: order-api-nest
        run: |
          npx prisma generate
          PGPASSWORD=order psql -h localhost -p 5433 -U order -d order_api -c "CREATE DATABASE order_api_test"
          ADMIN_DATABASE_URL=postgresql://order:order@localhost:5433/order_api_test npx prisma migrate deploy
      - run: npm run test:api

  test-web:
    name: 프론트 e2e
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env: { POSTGRES_USER: order, POSTGRES_PASSWORD: order, POSTGRES_DB: order_api }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U order -d order_api" --health-interval 2s --health-retries 15
      redis:
        image: redis:7
        ports: ["6380:6379"]
      storage:
        image: rustfs/rustfs:latest
        env: { RUSTFS_ACCESS_KEY: localaccess, RUSTFS_SECRET_KEY: localsecret123 }
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API 빌드·데모 데이터·실행
        working-directory: order-api-nest
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
          npm run build
          node --env-file=.env dist/main.js > api.log 2>&1 &
          # 준비될 때까지 최대 60초 기다린다(러너에 이미 있는 curl만 쓴다 - 실행 중에 패키지를 내려받지 않는다)
          for _ in $(seq 1 60); do curl -sf localhost:4000/health/ready > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: 프론트 환경 값
        working-directory: order-console-next
        run: |
          cp .env.example .env.local
          {
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "AUTH_GITHUB_ID=ci-dummy-client-id"
            echo "AUTH_GITHUB_SECRET=ci-dummy-secret"
          } >> .env.local
      - run: npx playwright install --with-deps chromium
        working-directory: order-console-next
      - run: npm run test:web
      - name: 실패하면 API 로그와 Playwright 결과를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-web-logs
          path: |
            order-api-nest/api.log
            order-console-next/test-results/
          retention-days: 7

  alert-rules:
    name: 경보 규칙 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:rules

  images:
    name: 이미지 빌드·올리기
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: order-api-nest/Dockerfile
          target: runtime
          push: ${{ github.ref_name == vars.DEPLOY_BRANCH }}
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/order-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: 마이그레이션 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: order-api-nest/Dockerfile
          target: migrate
          push: ${{ github.ref_name == vars.DEPLOY_BRANCH }}
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/order-api-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: 웹 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: order-console-next/Dockerfile
          push: ${{ github.ref_name == vars.DEPLOY_BRANCH }}
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/order-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_HOST }}
            NEXT_PUBLIC_STORAGE_URL=${{ vars.STORAGE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: 배포
    if: github.ref_name == vars.DEPLOY_BRANCH
    needs: [check, test-api, test-web, alert-rules, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.WEB_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH 준비
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: 설정 파일 올리기
        run: scp -rp deploy/compose.yml deploy/Caddyfile deploy/release.sh deploy/rollback.sh deploy/ops ubuntu@${{ vars.DEPLOY_HOST }}:/opt/node-order/
      - name: 대기 환경에 새 버전 띄우기
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "::add-mask::$TOKEN"
          echo "DEPLOY_SLOT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh ubuntu@${{ vars.DEPLOY_HOST }} bash /opt/node-order/release.sh up "${{ github.sha }}" "$TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 스모크 테스트(대기 환경)
        id: smoke
        working-directory: order-console-next
        env:
          SMOKE_URL: https://${{ vars.WEB_HOST }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:smoke
      - name: 트래픽 넘기기
        run: ssh ubuntu@${{ vars.DEPLOY_HOST }} bash /opt/node-order/release.sh switch
      - name: 스모크가 실패하면 대기 환경을 내린다
        if: failure() && steps.smoke.outcome == 'failure'
        run: ssh ubuntu@${{ vars.DEPLOY_HOST }} bash /opt/node-order/release.sh abort
      - name: 실패하면 스모크 결과를 남긴다
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: order-console-next/test-results/
          retention-days: 7
      - name: 공개 주소로 확인
        run: |
          for i in $(seq 1 12); do curl -fsS https://${{ vars.API_HOST }}/health/ready && break; echo " ($i) 다시 시도"; sleep 5; done
          curl -fsS https://${{ vars.API_HOST }}/health/ready
          curl -fsS -o /dev/null -w "웹 %{http_code}\n" https://${{ vars.WEB_HOST }}/

  prune-images:
    name: 오래된 이미지 정리
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [order-api, order-api-migrate, order-web]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: node-order/${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10

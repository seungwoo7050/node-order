[project]
name = "driftwatch"
version = "0.1.0"
description = "Periodic fact drift detector and debounce alert engine"
authors = [{ name = "woopinbell" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

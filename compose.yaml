services:
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  alertmanager:
    image: prom/alertmanager:v0.34.2
    profiles: ["monitoring"]
    # 설정은 운영과 같은 render.sh가 환경변수로 만든다. 개발은 scripts/alert-receiver.mjs(5001)로 보낸다
    entrypoint: ["/bin/sh", "/etc/alertmanager/render.sh", "--run"]
    command: ["--storage.path=/alertmanager", "--cluster.listen-address="]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://host.docker.internal:5001/slack}
      DEADMAN_URL: ${DEADMAN_URL:-http://pulsebox:8000/v1/monitors/order-api-watchdog/ping}
      ALERT_ENV: dev
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/render.sh:/etc/alertmanager/render.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    extra_hosts:
      - "host.docker.internal:host-gateway" # 운영 Prometheus SSH 터널(19090)
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
  db:
    image: postgres:17
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order_api
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "order", "-d", "order_api"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6380:6379"
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: localaccess
      RUSTFS_SECRET_KEY: localsecret123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data

  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"
      - "4318:4318"
  
  migrate:
    build: { context: ., dockerfile: order-api-nest/Dockerfile, target: migrate }
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://order:order@db:5432/order_api
      DEMO_PASSWORD: "1234"
      REDIS_URL: redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: order-api-nest/Dockerfile, target: runtime }
    profiles: ["app"]
    init: true
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-change-me}
      DEMO_PASSWORD: "1234"
      DEMO_LOGIN: "1"
      FRONTEND_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      ACCESS_TOKEN_TTL: 15m
      DATABASE_URL: postgresql://order_app:order_app@db:5432/order_api
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${PUBLIC_STORAGE_URL:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: localaccess
      S3_SECRET_KEY: localsecret123
      S3_BUCKET: product-images
      OTEL_SERVICE_NAME: order-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG-1}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      PGRELAY_URL: ${PGRELAY_URL:-}
      PGRELAY_WEBHOOK_SECRET: ${PGRELAY_WEBHOOK_SECRET:-pgrelay-default-secret}
      INGESTGUARD_URL: ${INGESTGUARD_URL:-}
      CITEGUARD_URL: ${CITEGUARD_URL:-}
      PULSEBOX_URL: ${PULSEBOX_URL:-}
      LOG_LEVEL: ${LOG_LEVEL-info}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      storage: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 6
  web:
    build:
      context: .
      dockerfile: order-console-next/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL:-http://localhost:9000}
    profiles: ["app"]
    init: true
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:4000
      AUTH_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GITHUB_ID: ${GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      api: { condition: service_healthy }

  aigate:
    image: golang:1.24-alpine
    profiles: ["polyglot"]
    working_dir: /src
    volumes:
      - ./services/aigate:/src:ro
    command: ["go", "run", "./cmd/aigate", "-listen", ":8081", "-primary", "https://api.anthropic.com", "-fallback", "https://api.openai.com"]
    ports:
      - "8081:8081"

  pgrelay:
    image: golang:1.24-alpine
    profiles: ["polyglot"]
    working_dir: /src
    volumes:
      - ./services/pgrelay:/src:ro
    command: ["go", "run", "./cmd/pgrelay", "-listen", ":8080", "-signing-secret", "${PGRELAY_WEBHOOK_SECRET:-pgrelay-default-secret}"]
    ports:
      - "8080:8080"

  idemguard:
    image: golang:1.24-alpine
    profiles: ["polyglot"]
    working_dir: /src
    volumes:
      - ./services/idemguard:/src:ro
    command: ["go", "run", "./cmd/idemguard", "-listen", ":8082", "-upstream", "http://api:4000", "-wait-policy", "wait"]
    ports:
      - "8082:8082"

  ingestguard:
    image: python:3.12-slim
    profiles: ["polyglot"]
    working_dir: /src
    volumes:
      - ./services/ingestguard:/src
    command: ["sh", "-c", "pip install --no-cache-dir -e . && ingestguard serve --host 0.0.0.0 --port 8001"]
    ports:
      - "8001:8001"

  driftwatch:
    image: python:3.12-slim
    profiles: ["polyglot", "monitoring"]
    working_dir: /src
    volumes:
      - ./services/driftwatch:/src
    command: ["sh", "-c", "pip install --no-cache-dir -e . && driftwatch serve --host 0.0.0.0 --port 8002"]
    ports:
      - "8002:8002"

  pulsebox:
    image: python:3.12-slim
    profiles: ["polyglot", "monitoring"]
    working_dir: /src
    volumes:
      - ./services/pulsebox:/src
    command: ["sh", "-c", "pip install --no-cache-dir -e . && pulsebox server --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["polyglot"]
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama:latest
    profiles: ["polyglot"]
    ports:
      - "11434:11434"

  citeguard:
    image: python:3.12-slim
    profiles: ["polyglot"]
    working_dir: /src
    environment:
      CITEGUARD_QDRANT_URL: http://qdrant:6333
      CITEGUARD_OLLAMA_URL: http://ollama:11434
      CITEGUARD_EMBED_MODEL: ${CITEGUARD_EMBED_MODEL:-all-minilm}
      CITEGUARD_CHAT_MODEL: ${CITEGUARD_CHAT_MODEL:-qwen2.5:0.5b}
    volumes:
      - ./services/citeguard:/src
    command: ["sh", "-c", "pip install --no-cache-dir -e . && citeguard serve --host 0.0.0.0 --port 8003"]
    ports:
      - "8003:8003"
    depends_on:
      - qdrant
      - ollama
  
volumes:
  pgdata:
  storagedata:
